name: Update goods data

# Weekly re-pull of the Hay Day goods dataset so newly-added goods (and their
# thumbnails) land in the repo automatically. The app's Refresh button then
# serves them with no redeploy. Also runnable on demand from the Actions tab.
on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays ~09:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch source dataset
        run: |
          mkdir -p _src
          curl -sSfL "https://raw.githubusercontent.com/drarvindc/hayday-tracker/main/data/hayday_product_data.js" \
            -o _src/hayday_product_data.js

      - name: Rebuild goods.js and fetch any new thumbnails
        run: node scripts/build-goods.mjs _src/hayday_product_data.js

      - name: Commit changes if the data moved
        run: |
          rm -rf _src
          if [ -n "$(git status --porcelain data/goods.js assets/items)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/goods.js assets/items
            git commit -m "chore: auto-update goods data ($(date -u +%F))"
            git push
          else
            echo "No changes to goods data."
          fi
