name: Scrape wiki goods

# Pulls the complete, current goods list straight from the Hay Day Wiki (GitHub
# runners can reach it; the dev environment can't). Phase 1 writes a discovery
# report to _debug/ so the parser can be finalized before it touches goods.js.
on:
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/scrape-wiki.mjs"
      - ".github/workflows/scrape-wiki.yml"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install parser deps
        run: npm init -y >/dev/null 2>&1 && npm install cheerio@1 >/dev/null 2>&1

      - name: Scrape
        run: node scripts/scrape-wiki.mjs

      - name: Commit outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _debug data/goods.js assets/items 2>/dev/null || true
          if [ -n "$(git status --porcelain _debug data/goods.js assets/items)" ]; then
            git commit -m "scrape: wiki run ($(date -u +%FT%TZ))"
            git push
          else
            echo "No changes."
          fi
